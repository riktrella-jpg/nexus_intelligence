# Configuración de Nginx para NEXUS INTELLIGENCE
# Ubicación en servidor: /etc/nginx/sites-available/nexus.conf
# Simbólico a: /etc/nginx/sites-enabled/nexus.conf

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    server_name nexus.tuempresa.com api.tuempresa.com;
    return 301 https://$host$request_uri;
}

# 2. Servidor para el Frontend (si está en el mismo servidor)
server {
    listen 443 ssl http2;
    server_name nexus.tuempresa.com;

    # Certificados SSL (generados por Certbot)
    ssl_certificate /etc/letsencrypt/live/nexus.tuempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.tuempresa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Límite de subida para archivos grandes (XLSX, CSV)
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Servidor para la API Backend (FastAPI)
server {
    listen 443 ssl http2;
    server_name api.tuempresa.com;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/api.tuempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tuempresa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Límite para subida de datasets de hasta 500MB
    client_max_body_size 500M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
