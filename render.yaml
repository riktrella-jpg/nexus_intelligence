services:
  - type: web
    name: nexus-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NEXUS_DATA_DIR
        value: data
      - key: NEXUS_CORS_ORIGINS
        value: "*"
      - key: NEXUS_AI_API_KEY
        sync: false
