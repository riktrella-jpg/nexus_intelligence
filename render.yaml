services:
  - type: web
    name: nexus-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: nexus-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NEXUS_DATA_DIR
        value: /app/data
      - key: NEXUS_CORS_ORIGINS
        value: "*"
